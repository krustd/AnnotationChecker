name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to build and release (e.g. v0.1.0)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  build:
    name: Build packages (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: ubuntu-latest
            target: linux

    steps:
      - name: Checkout code (tag for manual release)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Checkout code
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.release_tag == ''
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          version: "0.10.2"
          github-token: ""

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update --fix-missing
          sudo apt-get install -y libegl1 libxkbcommon0 libglib2.0-0 patchelf wget

      - name: Install dependencies
        run: |
          uv sync --locked --group dev

      - name: Build Windows executable
        if: matrix.os == 'windows-latest'
        run: |
          uv run pyinstaller main.py --name=AnnotationChecker-windows --onefile --windowed --clean --collect-all pyside6 --collect-all matplotlib

      - name: Build macOS app bundle
        if: matrix.os == 'macos-latest'
        run: |
          uv run pyinstaller main.py --name=AnnotationChecker-macos --windowed --clean --collect-all pyside6 --collect-all matplotlib

      - name: Build Linux executable
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run pyinstaller main.py --name=AnnotationChecker-linux --onefile --windowed --clean --collect-all pyside6 --collect-all matplotlib

      - name: Package macOS app
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          if [ -d AnnotationChecker-macos.app ]; then
            ditto -c -k --sequesterRsrc --keepParent AnnotationChecker-macos.app AnnotationChecker-macos.app.zip
          else
            zip -r AnnotationChecker-macos.app.zip AnnotationChecker-macos
          fi

      - name: Package Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          cp dist/AnnotationChecker-linux AppDir/usr/bin/AnnotationChecker
          chmod +x AppDir/usr/bin/AnnotationChecker

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/AnnotationChecker" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/usr/share/applications/annotationchecker.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=AnnotationChecker
          Exec=AnnotationChecker
          Icon=annotationchecker
          Terminal=false
          Categories=Graphics;
          EOF

          # 生成占位图标
          cat > AppDir/usr/share/icons/hicolor/256x256/apps/annotationchecker.png.base64 <<'EOF'
          iVBORw0KGgoAAAANSUhEUgAAAQAAAAEACAIAAADTED8xAAAABnRSTlMAAAAAAABupgeRAAAAf0lEQVR4nO3BMQEAAADCoPVP7WENoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgB8GxAABfN2tNwAAAABJRU5ErkJggg==
          EOF
          base64 -d AppDir/usr/share/icons/hicolor/256x256/apps/annotationchecker.png.base64 > AppDir/usr/share/icons/hicolor/256x256/apps/annotationchecker.png
          rm AppDir/usr/share/icons/hicolor/256x256/apps/annotationchecker.png.base64

          cp AppDir/usr/share/icons/hicolor/256x256/apps/annotationchecker.png AppDir/annotationchecker.png
          ln -sf usr/share/applications/annotationchecker.desktop AppDir/annotationchecker.desktop
          ln -sf usr/share/icons/hicolor/256x256/apps/annotationchecker.png AppDir/.DirIcon

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool.AppImage AppDir dist/AnnotationChecker-linux.AppImage
          chmod +x dist/AnnotationChecker-linux.AppImage

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: annotationchecker-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.app.zip
            dist/*.AppImage

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: annotationchecker-*
          path: release-assets
          merge-multiple: true

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "value=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.value }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.app.zip
            release-assets/*.AppImage
